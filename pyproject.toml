[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cbmp-sat"
version = "0.1.0"
description = "Cyclic Bandwidth Minimization Problem"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7", "python-sat>=1.8.dev1", "scipy>=1.15"]
plots = ["cnsplots>=0.8.0"]
windows-memory = ["pywin32; sys_platform == 'win32'"]
engines = ["gurobipy>=13.0.3,<14", "ortools", "docplex", "cplex"]
sat = ["python-sat>=1.8.dev1"]
data = ["scipy>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
